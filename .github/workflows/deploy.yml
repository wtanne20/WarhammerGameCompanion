name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: army-tracker-project/army-tracker/package-lock.json
      - working-directory: army-tracker-project/army-tracker
        run: npm ci
      # GitHub Pages project sites serve from /<repo-name>/, not the domain
      # root, so the build needs to know that ahead of time (see
      # src/lib/paths.js for how every asset path accounts for this).
      - working-directory: army-tracker-project/army-tracker
        run: npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: army-tracker-project/army-tracker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
