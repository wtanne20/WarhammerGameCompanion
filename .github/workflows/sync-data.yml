name: Sync Wahapedia data

# Keeps the datasheet/detachment catalog current with whatever Games
# Workshop has published lately, without anyone needing to remember to run
# `npm run sync-data` by hand. A push here (only happens when the data
# actually changed) triggers deploy.yml automatically.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: army-tracker-project/army-tracker/package-lock.json
      - working-directory: army-tracker-project/army-tracker
        run: npm ci
      # The stats/points side comes from the @alpaca-software/40kdc-data npm
      # package, which `npm ci` alone pins at whatever version the lockfile
      # records, so new points/datasheet releases there would never reach
      # the app. Pull the newest release allowed by package.json's range
      # each run (a new major may change the API sync-data.mjs relies on, so
      # that stays a deliberate manual bump). Only public/data is committed
      # below, so the lockfile edit this makes is discarded and never
      # triggers an APK release (release-android.yml watches those files).
      - working-directory: army-tracker-project/army-tracker
        run: npm update @alpaca-software/40kdc-data
      - working-directory: army-tracker-project/army-tracker
        run: npm run sync-data
      - working-directory: army-tracker-project/army-tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-sync Wahapedia data"
            git push
          fi
